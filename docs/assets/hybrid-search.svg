    <rect x="560" y="110" width="120" height="70" rx="12" fill="#13232a" stroke="#1f3a40"/><text x="620" y="140" fill="#e6f1ef" font-weight="600">Rerank</text><text x="620" y="160" fill="#8aa3a0" font-size="11">top N = 5</text>

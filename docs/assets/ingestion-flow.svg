<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1416"/><stop offset="1" stop-color="#0f1f22"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2ee59d"/></marker>
  </defs>
  <rect width="960" height="300" rx="18" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e6f1ef" font-size="20" font-weight="700">Document lifecycle</text>
  <text x="40" y="70" fill="#8aa3a0" font-size="13">Register once, then call /process until the status is ready or failed. Every call is safe to repeat.</text>

  <g font-size="12">
    <rect x="40" y="110" width="170" height="96" rx="12" fill="#13232a" stroke="#1f3a40"/>
    <text x="125" y="138" text-anchor="middle" fill="#2ee59d" font-weight="700" font-family="ui-monospace,Menlo,monospace">POST /documents</text>
    <text x="125" y="162" text-anchor="middle" fill="#e6f1ef">stores the URL only</text>
    <text x="125" y="182" text-anchor="middle" fill="#8aa3a0">→ 202 { id }</text>

    <rect x="270" y="110" width="110" height="96" rx="48" fill="#183037" stroke="#5d7b78"/>
    <text x="325" y="152" text-anchor="middle" fill="#e6f1ef" font-weight="700">pending</text>
    <text x="325" y="172" text-anchor="middle" fill="#8aa3a0">0 / 0</text>

    <rect x="440" y="110" width="200" height="96" rx="12" fill="#13232a" stroke="#1f3a40"/>
    <text x="540" y="136" text-anchor="middle" fill="#2ee59d" font-weight="700" font-family="ui-monospace,Menlo,monospace">POST /:id/process</text>
    <text x="540" y="158" text-anchor="middle" fill="#e6f1ef">1st call: download, parse, chunk</text>
    <text x="540" y="178" text-anchor="middle" fill="#e6f1ef">every call: embed next batch</text>
    <text x="540" y="196" text-anchor="middle" fill="#8aa3a0">(INGEST_BATCH_SIZE chunks)</text>

    <rect x="700" y="96" width="110" height="60" rx="30" fill="#183037" stroke="#5d7b78"/>
    <text x="755" y="122" text-anchor="middle" fill="#e6f1ef" font-weight="700">processing</text>
    <text x="755" y="140" text-anchor="middle" fill="#8aa3a0">256 / 900</text>

    <rect x="840" y="96" width="90" height="48" rx="24" fill="#0f3a2b" stroke="#2ee59d"/>
    <text x="885" y="125" text-anchor="middle" fill="#2ee59d" font-weight="700">ready ✓</text>
    <rect x="840" y="176" width="90" height="48" rx="24" fill="#3a1717" stroke="#e35d5d"/>
    <text x="885" y="205" text-anchor="middle" fill="#ff8a8a" font-weight="700">failed ✗</text>
  </g>
  <path d="M210 158 H268" stroke="#2ee59d" stroke-width="2" marker-end="url(#a)"/>
  <path d="M380 158 H438" stroke="#2ee59d" stroke-width="2" marker-end="url(#a)"/>
  <path d="M640 140 H698" stroke="#2ee59d" stroke-width="2" marker-end="url(#a)"/>
  <path d="M810 120 H838" stroke="#2ee59d" stroke-width="2" marker-end="url(#a)"/>
  <path d="M640 190 C 740 190, 780 200, 838 200" stroke="#e35d5d" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M755 156 C 755 250, 540 250, 540 210" stroke="#5d7b78" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="600" y="262" fill="#8aa3a0" font-size="12">loop until every chunk has an embedding</text>
  <text x="40" y="262" fill="#8aa3a0" font-size="12">Unparseable file, no text, or 4xx download → failed.</text>
  <text x="40" y="282" fill="#8aa3a0" font-size="12">5xx download or embedding error → 502, stays processing — just call again.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

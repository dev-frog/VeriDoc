    <circle cx="104" cy="536" r="9" fill="none" stroke="#2ee59d" stroke-width="2.5"/><path d="M100 536 l3 3 l6 -6" stroke="#2ee59d" stroke-width="2.5" fill="none"/>
    <text x="121" y="542" fill="#2ee59d" font-weight="600">Open source</text>
    <rect x="242" y="516" width="190" height="40" rx="20" fill="#0e1d20" stroke="#24403f"/>
    <text x="262" y="542" fill="#e6f1ef" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15"><tspan fill="#2ee59d">[Source 1]</tspan> cited</text>
    <rect x="444" y="516" width="136" height="40" rx="20" fill="#0e1d20" stroke="#24403f"/>
    <text x="464" y="542" fill="#e6f1ef">MIT license</text>
  </g>


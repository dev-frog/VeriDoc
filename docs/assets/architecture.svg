<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1416"/><stop offset="1" stop-color="#0f1f22"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2ee59d"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d7b78"/></marker>
  </defs>
  <rect width="960" height="520" rx="18" fill="url(#bg)"/>
  <text x="40" y="52" fill="#e6f1ef" font-size="22" font-weight="700">VeriDoc architecture</text>
  <text x="40" y="76" fill="#8aa3a0" font-size="13">Stateless HTTP API on Vercel · engine in src/core · storage + search in MongoDB Atlas · AI via external APIs</text>

  <!-- Client -->
  <rect x="40" y="200" width="150" height="110" rx="12" fill="#13232a" stroke="#1f3a40"/>
  <text x="115" y="238" text-anchor="middle" fill="#e6f1ef" font-size="15" font-weight="600">Your app</text>
  <text x="115" y="260" text-anchor="middle" fill="#8aa3a0" font-size="12">curl · SDK · CLI</text>
  <text x="115" y="282" text-anchor="middle" fill="#8aa3a0" font-size="12">Bearer API key</text>

  <!-- Blob -->
  <rect x="40" y="380" width="150" height="80" rx="12" fill="#13232a" stroke="#1f3a40"/>
  <text x="115" y="414" text-anchor="middle" fill="#e6f1ef" font-size="14" font-weight="600">Vercel Blob</text>
  <text x="115" y="436" text-anchor="middle" fill="#8aa3a0" font-size="12">file storage (https)</text>
  <path d="M115 310 V378" stroke="#5d7b78" stroke-width="2" marker-end="url(#g)"/>
  <text x="122" y="350" fill="#5d7b78" font-size="11">1. upload</text>

  <!-- API -->
  <rect x="250" y="120" width="420" height="340" rx="14" fill="#0f1c20" stroke="#2ee59d" stroke-opacity=".55"/>
  <text x="270" y="150" fill="#2ee59d" font-size="13" font-weight="700" letter-spacing="1">VERIDOC  ·  Hono on Vercel</text>

  <rect x="270" y="168" width="380" height="58" rx="10" fill="#13232a" stroke="#1f3a40"/>
  <text x="290" y="193" fill="#e6f1ef" font-size="14" font-weight="600">src/api</text>
  <text x="290" y="213" fill="#8aa3a0" font-size="12">routes · auth · request IDs · logs · error mapping</text>

  <rect x="270" y="240" width="380" height="200" rx="10" fill="#13232a" stroke="#1f3a40"/>
  <text x="290" y="265" fill="#e6f1ef" font-size="14" font-weight="600">src/core  (no HTTP code)</text>
  <g font-size="12" fill="#e6f1ef">
    <rect x="290" y="280" width="78" height="34" rx="8" fill="#183037"/><text x="329" y="302" text-anchor="middle">fetch</text>
    <rect x="378" y="280" width="78" height="34" rx="8" fill="#183037"/><text x="417" y="302" text-anchor="middle">parse</text>
    <rect x="466" y="280" width="78" height="34" rx="8" fill="#183037"/><text x="505" y="302" text-anchor="middle">chunk</text>
    <rect x="554" y="280" width="78" height="34" rx="8" fill="#183037"/><text x="593" y="302" text-anchor="middle">embed</text>
  </g>
  <path d="M368 297h8M456 297h8M544 297h8" stroke="#2ee59d" stroke-width="2"/>
  <text x="290" y="338" fill="#8aa3a0" font-size="11">PDF (+ OCR) · MD · DOCX · TXT → chunks with page + heading</text>

  <g font-size="12">
    <rect x="290" y="356" width="160" height="34" rx="8" fill="#183037"/><text x="370" y="378" text-anchor="middle" fill="#e6f1ef">hybrid search + rerank</text>
    <rect x="462" y="356" width="170" height="34" rx="8" fill="#183037"/><text x="547" y="378" text-anchor="middle" fill="#e6f1ef">verified cited answers</text>
  </g>
  <text x="290" y="420" fill="#8aa3a0" font-size="11">Each /process call does a bounded batch → fits the 300 s function limit</text>

  <path d="M190 255 H248" stroke="#2ee59d" stroke-width="2" marker-end="url(#a)"/>
  <text x="196" y="246" fill="#2ee59d" font-size="11">2. REST</text>
  <path d="M190 430 H248" stroke="#5d7b78" stroke-width="2" marker-end="url(#g)"/>
  <text x="194" y="421" fill="#5d7b78" font-size="11">3. fetch</text>

  <!-- Mongo -->
  <rect x="705" y="120" width="225" height="190" rx="12" fill="#13232a" stroke="#1f3a40"/>
  <text x="817" y="150" text-anchor="middle" fill="#e6f1ef" font-size="15" font-weight="600">MongoDB Atlas</text>
  <g font-size="12" fill="#8aa3a0">
    <text x="723" y="180">▸ documents</text>
    <text x="723" y="202">▸ chunks (+ embedding)</text>
    <text x="723" y="230" fill="#2ee59d">◆ Vector Search index</text>
    <text x="723" y="252" fill="#2ee59d">◆ Atlas Search (BM25)</text>
    <text x="723" y="280">$rankFusion (8.1+)</text>
  </g>
  <path d="M650 260 H703" stroke="#2ee59d" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- Providers -->
  <rect x="705" y="340" width="225" height="120" rx="12" fill="#13232a" stroke="#1f3a40"/>
  <text x="817" y="368" text-anchor="middle" fill="#e6f1ef" font-size="15" font-weight="600">AI providers</text>
  <g font-size="12" fill="#8aa3a0">
    <text x="723" y="394">Embeddings: any OpenAI-compatible</text>
    <text x="723" y="414" font-size="11">OpenRouter · OpenAI · Azure · Voyage</text>
    <text x="723" y="434">Rerank: Cohere · Voyage · Jina</text>
    <text x="723" y="452">LLM + OCR: any OpenAI-compatible</text>
  </g>
  <path d="M650 400 H703" stroke="#2ee59d" stroke-width="2" marker-end="url(#a)"/>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

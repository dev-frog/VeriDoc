  <g transform="translate(936 548)" stroke="#2ee59d" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 0 H0 V40 H12"/><path d="M38 0 H50 V40 H38"/><path d="M14 20 L22 28 L36 12"/>

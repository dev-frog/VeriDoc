  <rect x="972" y="290" width="98" height="64" rx="18" fill="url(#lens)" stroke="#0a0f10" stroke-width="7"/>
  <path d="M948 312 Q960 304 972 312" stroke="#0a0f10" stroke-width="8" fill="none"/>

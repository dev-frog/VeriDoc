<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071012"/><stop offset=".6" stop-color="#0b1a1d"/><stop offset="1" stop-color="#0c2420"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2ee59d" stop-opacity=".38"/><stop offset=".55" stop-color="#2ee59d" stop-opacity=".08"/><stop offset="1" stop-color="#2ee59d" stop-opacity="0"/></radialGradient>
    <radialGradient id="fur" cx=".45" cy=".35" r=".75"><stop offset="0" stop-color="#b9805a"/><stop offset=".7" stop-color="#8f5a3a"/><stop offset="1" stop-color="#6e4129"/></radialGradient>
    <radialGradient id="cream" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fbe7cf"/><stop offset="1" stop-color="#e9c9a5"/></radialGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#28343b"/><stop offset="1" stop-color="#141b1f"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16302a"/><stop offset=".5" stop-color="#05090a"/><stop offset="1" stop-color="#0b1a16"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4fffb"/><stop offset="1" stop-color="#cfeee3"/></linearGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd6da"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2ee59d" stroke-opacity=".05"/></pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <!-- hills -->
  <path d="M640 640 L760 520 L840 560 L930 470 L1040 540 L1120 480 L1280 560 L1280 640Z" fill="#0f2a25" opacity=".7"/>
  <ellipse cx="960" cy="400" rx="380" ry="300" fill="url(#glow)"/>

  <!-- ===== LEFT: brand ===== -->
  <g transform="translate(80 110)">
    <g stroke="#2ee59d" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 0 H0 V64 H18"/><path d="M62 0 H80 V64 H62"/><path d="M22 32 L36 46 L58 20"/>
    </g>
    <text x="104" y="56" font-size="62" font-weight="800" fill="#f2fbf8" letter-spacing="-1.5">Veri<tspan fill="#2ee59d">Doc</tspan></text>
    <path d="M232 76 Q 290 66 350 72" stroke="#2ee59d" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <text x="80" y="280" font-size="54" font-weight="800" fill="#f2fbf8" letter-spacing="-1">Search smarter.</text>
  <text x="80" y="344" font-size="54" font-weight="800" fill="#f2fbf8" letter-spacing="-1">Trust the <tspan fill="#2ee59d">source.</tspan></text>
  <text x="82" y="392" font-size="20" fill="#93aba7">Open-source RAG engine. Every answer, traced to its source.</text>

  <!-- search bar -->
  <g filter="url(#soft)">
    <rect x="80" y="428" width="500" height="64" rx="16" fill="#0e1d20" stroke="#2ee59d" stroke-opacity=".7" stroke-width="2"/>
  </g>
  <rect x="80" y="428" width="500" height="64" rx="16" fill="none" stroke="#2ee59d" stroke-opacity=".25" stroke-width="8" filter="url(#blur)"/>
  <circle cx="117" cy="457" r="11" fill="none" stroke="#93aba7" stroke-width="3"/><path d="M125 465 L134 474" stroke="#93aba7" stroke-width="3" stroke-linecap="round"/>
  <text x="150" y="467" font-size="21" fill="#93aba7">How do I rotate API keys?</text>
  <rect x="530" y="440" width="40" height="40" rx="10" fill="#2ee59d"/>
  <path d="M541 460 H559 M552 452 L560 460 L552 468" stroke="#06231a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>


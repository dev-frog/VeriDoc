    <g transform="translate(1110 120) rotate(9)"><rect width="104" height="128" rx="12" fill="#c9d6de"/><g stroke="#8d9fac" stroke-width="7" stroke-linecap="round"><path d="M18 28H84M18 50H74M18 72H82"/></g></g>
    <g transform="translate(1140 330) rotate(6)"><rect width="90" height="112" rx="11" fill="#c9d6de"/><g stroke="#8d9fac" stroke-width="6" stroke-linecap="round"><path d="M16 26H72M16 46H64M16 66H70"/></g></g>
    <g transform="translate(680 390) rotate(-6)"><rect width="84" height="104" rx="10" fill="#c9d6de"/><g stroke="#8d9fac" stroke-width="6" stroke-linecap="round"><path d="M14 24H68M14 44H58M14 64H64"/></g></g>
  </g>

